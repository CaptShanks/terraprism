version: "2"
linters:
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Printf
        - fmt.Print
        - fmt.Println
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
